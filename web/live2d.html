<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PetCore Live2D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important;color:#f4eee4;font:13px system-ui,sans-serif}body{display:flex;flex-direction:column}#status{position:absolute;top:10px;left:12px;z-index:4;padding:6px 10px;border-radius:10px;background:#171923c9}#close{position:absolute;top:10px;right:12px;z-index:6;width:30px;height:30px;padding:0;border-radius:50%;background:#171923d9}#chat{position:absolute;z-index:5;bottom:10px;left:10px;right:10px;display:flex;gap:6px;background:#171923dc;border:1px solid #ffffff22;border-radius:12px;padding:7px}#reply{position:absolute;z-index:4;left:12px;bottom:58px;right:12px;max-height:30%;overflow:auto;white-space:pre-wrap;text-shadow:0 1px 4px #000}input,button{font:inherit;color:inherit;background:#242633;border:1px solid #ffffff25;border-radius:8px;padding:8px}input{min-width:0;flex:1}button{cursor:pointer;background:#a84d5c}canvas{position:absolute;inset:0;width:100vw!important;height:100vh!important;touch-action:none}
</style></head><body><div id="status">正在连接角色…</div><button id="close" type="button" aria-label="关闭桌面形象">×</button><div id="reply"></div><form id="chat"><input id="message" placeholder="和角色聊天…" autocomplete="off"><button>发送</button></form>
<script src="/vendor/cubism5/Core/live2dcubismcore.min.js"></script><script type="module">
const q=new URLSearchParams(location.search),id=q.get('character');const status=document.getElementById('status'),reply=document.getElementById('reply'),form=document.getElementById('chat');let sessionId='';
document.getElementById('close').addEventListener('click',()=>fetch('/api/desktop/live2d/close',{method:'POST'}));
const api=async(path,opts)=>{const r=await fetch(path,opts);const d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d};
try{if(!id)throw Error('缺少角色 ID');const cards=await api('/api/characters');const card=cards.characters.find(c=>c.id===id);if(!card)throw Error('找不到角色');if(!card.live2d_model)throw Error('请先在角色卡中上传 Live2D 模型目录');const modelUrl=card.live2d_model;const slash=modelUrl.lastIndexOf('/');const filename=modelUrl.slice(slash+1);const modelName=filename.replace(/\.model3\.json$/i,'');if(modelName===filename)throw Error('模型入口不是 .model3.json');window.PETCORE_MODEL_DIR=modelUrl.slice(0,slash+1);window.PETCORE_MODEL_NAME=modelName;window.PETCORE_TRANSPARENT=true;document.title=`PetCore - ${card.name} - Live2D`;status.textContent=`${card.name} · Live2D 桌面形象`;
const created=await api('/api/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character_id:id})});sessionId=created.session.id;reply.textContent=created.greeting||'';await import('/vendor/cubism5/Demo/dist/main.js');
}catch(e){status.textContent=e.message;}
form.addEventListener('submit',async e=>{e.preventDefault();const input=document.getElementById('message');const text=input.value.trim();if(!text||!sessionId)return;input.value='';reply.textContent='…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sessionId,message:text})});if(!r.ok)throw Error('聊天请求失败');const reader=r.body.getReader(),decoder=new TextDecoder();let buf='',answer='';while(true){const {value,done}=await reader.read();if(done)break;buf+=decoder.decode(value,{stream:true});const blocks=buf.split('\n\n');buf=blocks.pop()||'';for(const block of blocks){const line=block.split('\n').find(x=>x.startsWith('data:'));if(!line)continue;const event=JSON.parse(line.slice(5).trim());if(event.type==='assistant_start')answer='';if(event.type==='assistant_delta')answer+=event.data.content||'';if(event.type==='assistant')answer=event.data.content||answer;reply.textContent=answer;}}}catch(err){reply.textContent=err.message;}});
</script></body></html>
